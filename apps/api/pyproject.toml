[project]
name = "retailops-api"
version = "0.1.0"
description = "RetailOps AI backend API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0.0",
]

[project.scripts]
retailops-seed = "retailops_api.db.seed:main"
retailops-synthetic = "retailops_api.ingestion.cli:main"
retailops-forecast = "retailops_api.forecasting.cli:main"
retailops-train = "retailops_api.forecasting.train_cli:main"
retailops-documents = "retailops_api.documents.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retailops_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic templates always import `op`/`sa`, even when a revision does not use them.
"migrations/versions/*" = ["F401", "I001"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "openpyxl", "openpyxl.*", "pypdf", "pypdf.*"]
ignore_missing_imports = true
